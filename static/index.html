<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive-to-Text</title>
  <style>
    :root {
      --bg:#f1f8f6; --card:#ffffff; --text:#17332f; --muted:#5f7c77;
      --accent:#0f9d8a; --accent-dark:#0b7a6b; --accent-soft:#dcf3ee; --border:#dcebe7;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--text);
      background-color:var(--bg);
      background-image: linear-gradient(180deg, #d6f1ea 0, #f1f8f6 300px);
      background-repeat:no-repeat;
    }
    main { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; }
    h1 { font-size: 1.7rem; margin: 0 0 4px; letter-spacing:-.02em; color:var(--accent-dark); }
    .sub { color:var(--muted); margin: 0 0 22px; }
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px;
      box-shadow: 0 6px 24px rgba(20,90,80,.08);
    }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input[type=text] {
      flex:1; min-width:220px; padding:11px 12px; border:1px solid var(--border); border-radius:10px;
      font-size:1rem; color:var(--text); background:#f8fcfb; outline:none;
    }
    input[type=text]:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    select, button {
      padding:10px 16px; border-radius:10px; border:1px solid var(--border); font-size:.95rem;
      background:#fff; color:var(--text); cursor:pointer; transition: background .15s, box-shadow .15s;
    }
    select { outline:none; }
    button:hover:not(:disabled) { background:var(--accent-soft); }
    button.primary {
      background: linear-gradient(135deg, #17b8a4, #0f9d8a); color:#fff; border-color:transparent; font-weight:600;
      box-shadow: 0 4px 12px rgba(15,157,138,.35);
    }
    button.primary:hover:not(:disabled) { background: linear-gradient(135deg, #0f9d8a, #0b7a6b); }
    button:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
    table { width:100%; border-collapse:collapse; margin-top:14px; }
    th { text-align:left; padding:8px; font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-bottom:2px solid var(--border); }
    td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); font-size:.92rem; }
    tbody tr:hover { background:#f3faf8; }
    input[type=checkbox] { width:17px; height:17px; accent-color:var(--accent); cursor:pointer; }
    .badge { padding:3px 10px; border-radius:999px; font-size:.78rem; font-weight:700; }
    .pending { background:#e8f1ef; color:#566f6a; }
    .processing { background:#fff1cc; color:#8a5a00; }
    .done { background:#d9f3dc; color:#1b7a2f; }
    .failed { background:#fde3e3; color:#b3261e; }
    pre { white-space:pre-wrap; background:#f2faf8; border:1px solid var(--border); padding:12px; border-radius:10px; max-height:240px; overflow:auto; font-size:.85rem; }
    details { margin-top:8px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:#fff; }
    summary { cursor:pointer; font-weight:600; }
    .error { color:#b3261e; margin-top:10px; }
    .hidden { display:none; }
    .count { font-weight:700; color:var(--accent); background:var(--accent-soft); padding:3px 10px; border-radius:999px; font-size:.9rem; }
  </style>
</head>
<body>
<main>
  <h1>Drive-to-Text</h1>
  <p class="sub">Paste a public Google Drive folder link, pick PDFs and images, and extract their text.</p>

  <section class="card">
    <div class="row">
      <input id="link" type="text" placeholder="https://drive.google.com/drive/folders/...">
      <button id="load" class="primary">List files</button>
    </div>
    <div id="error" class="error hidden"></div>
  </section>

  <section id="filesCard" class="card hidden">
    <div class="row">
      <button id="selectAll">Select all</button>
      <span id="count" class="count">(0)</span>
      <select id="lang" title="OCR language">
        <option value="fra+eng">French + English</option>
        <option value="eng">English</option>
        <option value="fra">French</option>
        <option value="ara">Arabic</option>
      </select>
      <button id="validate" class="primary">Validate</button>
      <button id="export" class="hidden">Export JSON</button>
    </div>
    <table>
      <thead><tr><th></th><th>Name</th><th>Type</th><th>Size</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section id="resultsCard" class="card hidden">
    <h2 style="margin-top:0;font-size:1.1rem">Extracted text</h2>
    <div id="results"></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let files = [];
  let lastResults = [];

  function showError(msg) {
    $("error").textContent = msg || "";
    $("error").classList.toggle("hidden", !msg);
  }

  function fmtSize(n) {
    return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");
    return data;
  }

  function badge(status) { return `<span class="badge ${status}">${status}</span>`; }

  function updateCount() {
    const n = document.querySelectorAll(".pick:checked").length;
    $("count").textContent = "(" + n + ")";
  }

  function renderFiles() {
    $("rows").innerHTML = files.map((f, i) => `
      <tr>
        <td><input type="checkbox" class="pick" data-i="${i}"></td>
        <td>${f.name.replace(/</g, "&lt;")}</td>
        <td>${f.type.toUpperCase()}</td>
        <td>${fmtSize(f.size)}</td>
        <td id="st-${f.id}">${badge("pending")}</td>
      </tr>`).join("");
    updateCount();
  }

  $("rows").addEventListener("change", updateCount);

  $("load").onclick = async () => {
    showError("");
    $("load").disabled = true;
    $("load").textContent = "Loading...";
    try {
      const data = await api("/api/files", { url: $("link").value.trim() });
      files = data.files;
      if (!files.length) { showError("No PDF or image found in this folder."); $("filesCard").classList.add("hidden"); return; }
      renderFiles();
      $("filesCard").classList.remove("hidden");
      $("resultsCard").classList.add("hidden");
      $("export").classList.add("hidden");
    } catch (e) {
      showError(e.message);
      $("filesCard").classList.add("hidden");
    } finally {
      $("load").disabled = false;
      $("load").textContent = "List files";
    }
  };

  $("selectAll").onclick = () => {
    const boxes = document.querySelectorAll(".pick");
    const all = [...boxes].every((b) => b.checked);
    boxes.forEach((b) => (b.checked = !all));
    updateCount();
  };

  function renderResults(results) {
    $("resultsCard").classList.remove("hidden");
    $("results").innerHTML = results.map((r) => `
      <details>
        <summary>${r.name.replace(/</g, "&lt;")} ${badge(r.status)} ${r.method ? "(" + r.method + ")" : ""}</summary>
        ${r.error ? `<p class="error">${r.error.replace(/</g, "&lt;")}</p>` : ""}
        ${r.text ? `<pre>${r.text.replace(/</g, "&lt;")}</pre>` : ""}
      </details>`).join("");
  }

  $("validate").onclick = async () => {
    const selected = [...document.querySelectorAll(".pick")].filter((b) => b.checked).map((b) => files[b.dataset.i]);
    if (!selected.length) { showError("Select at least one file."); return; }
    showError("");
    $("validate").disabled = true;
    try {
      const { job_id } = await api("/api/process", { files: selected, lang: $("lang").value });
      while (true) {
        const job = await api("/api/jobs/" + job_id);
        lastResults = job.results;
        job.results.forEach((r) => { const c = $("st-" + r.id); if (c) c.innerHTML = badge(r.status); });
        renderResults(job.results);
        if (job.finished) break;
        await new Promise((r) => setTimeout(r, 1000));
      }
      $("export").classList.remove("hidden");
    } catch (e) {
      showError(e.message);
    } finally {
      $("validate").disabled = false;
    }
  };

  $("export").onclick = () => {
    const blob = new Blob([JSON.stringify(lastResults, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "extraction.json";
    a.click();
  };
</script>
</body>
</html>
